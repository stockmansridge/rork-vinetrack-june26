name: Issue 55 Android parity native validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue55-android-validation.yml'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/components/Components.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/DamageRecordsScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/YieldScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/SeasonYieldOverviewScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/PinsScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/VineyardMapScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/UnifiedPinComposerScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/CostReportsScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/IrrigationScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/HomeDashboard.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/CostReportBuilder.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/IrrigationForecastRepository.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/insights/VineyardInsightsSyncWorker.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/insights/VineyardInsightsSyncRepository.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue55-android-parity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36 with current command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Assert source revision and supply CI-only generated config
        shell: bash
        run: |
          set -euo pipefail
          echo "Source SHA: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          CONFIG=android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
          if [ ! -f "$CONFIG" ]; then
            cat > "$CONFIG" <<'KOTLIN'
          package com.rork.vinetrack
          object Config {
              val allValues: Map<String, String> = emptyMap()
          }
          KOTLIN
          fi
      - name: Compile Android and verify Issue 55 functional contracts
        working-directory: android-vinetrack
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests "com.rork.vinetrack.data.MobileCostingParityTest" \
            --tests "com.rork.vinetrack.data.ForecastParityContractTest" \
            --tests "com.rork.vinetrack.data.IrrigationCalculatorFixtureTest" \
            --tests "com.rork.vinetrack.data.YieldVintageReportTest" \
            --tests "com.rork.vinetrack.data.SeasonYieldDamageParityTest" \
            --tests "com.rork.vinetrack.data.DamageMapInteractionRegressionTest" \
            --tests "com.rork.vinetrack.data.MainSurfaceRestorationTest" \
            --tests "com.rork.vinetrack.data.PinsMapCurrentLocationRegressionTest" \
            --tests "com.rork.vinetrack.data.PinsMapFollowMeRegressionTest" \
            --tests "com.rork.vinetrack.data.insights.VineyardInsightsContractCorrectionTest" \
            --tests "com.rork.vinetrack.data.insights.ScoutCaptureTest" \
            --tests "com.rork.vinetrack.data.insights.VintageNotesTest"
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue55-jvm-test-results
          path: |
            android-vinetrack/app/build/test-results/testDebugUnitTest/
            android-vinetrack/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
