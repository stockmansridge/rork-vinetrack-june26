name: iOS actual water RPC contract
on:
  push:
    branches: [fix/spray-review-recovery-contracts-20261101]
    paths: [.github/workflows/ios-actual-water-contract.yml]
permissions:
  contents: write
jobs:
  reviewed-source:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed nullable argument correction
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/spray-review-recovery-contracts-20261101"
          git merge-base --is-ancestor f1a5115eb7ff15538a612817c5992d09110ca22f HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('ios/VineTrack/Backend/Sync/SprayTankActualStore.swift')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='42dafc5df9dc0360b2b76e7c4fecd024388fd45ce9440f0d36a137408e3d0f39'
          s=s.replace('nonisolated private struct SprayTankActualUpsertRequest: Encodable, Sendable {','nonisolated struct SprayTankActualUpsertRequest: Encodable, Sendable {',1)
          old='        try container.encodeIfPresent(actual.waterVolumeL, forKey: .waterVolumeL)'
          new='''        // Required RPC argument; null means Not recorded, not an omitted parameter or zero.
                  if let water = actual.waterVolumeL {
                      try container.encode(water, forKey: .waterVolumeL)
                  } else {
                      try container.encodeNil(forKey: .waterVolumeL)
                  }'''
          assert s.count(old)==1
          s=s.replace(old,new)
          assert hashlib.sha256(s.encode()).hexdigest()=='f0f42996cdac259f0c28d7cc7a11d36fe6a0a66cdf527ca6c3cc054db2cc1bde'
          p.write_text(s)
          p=Path('ios/VineTrackTests/SprayInitialTankAmountsTests.swift')
          s=p.read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='af537df53165691836c7022d68424f57c5fff043960ee42c90ffe4bbcb0a5238'
          addition='''    func testActualRPCAlwaysIncludesWaterArgumentWithoutInventingAQuantity() throws {
                  let f = try fixture()
                  for water: Double? in [nil, 0, 294.7] {
                      let actual = try SprayTankActual(id: f.actual.id, vineyardId: f.actual.vineyardId,
                          sprayRecordId: f.actual.sprayRecordId, tripId: f.actual.tripId,
                          tankSessionId: f.actual.tankSessionId, tankNumber: f.actual.tankNumber,
                          waterVolumeL: water, chemicals: f.actual.chemicals, confirmedAt: f.actual.confirmedAt,
                          confirmedBy: f.actual.confirmedBy, clientUpdatedAt: f.actual.clientUpdatedAt)
                      let data = try JSONEncoder().encode(SprayTankActualUpsertRequest(actual: actual))
                      let body = try XCTUnwrap(JSONSerialization.jsonObject(with: data) as? [String: Any])
                      XCTAssertTrue(body.keys.contains("p_water_volume_l"))
                      if let water {
                          XCTAssertEqual((body["p_water_volume_l"] as? NSNumber)?.doubleValue, water)
                      } else {
                          XCTAssertTrue(body["p_water_volume_l"] is NSNull)
                      }
                      XCTAssertEqual(actual.waterVolumeL, water)
                  }
              }

          '''
          assert s.endswith('\n}\n')
          s=s[:-2]+addition+'}\n'
          assert hashlib.sha256(s.encode()).hexdigest()=='334140706b6885330ab6ecf061b327b918dcac18fc9e824b125ed7592a42aeb8'
          p.write_text(s)
          p=Path('docs/reviews/spray-review-and-recovery-writer-contracts-20261101.md')
          s=p.read_text().replace('Four new iOS handoff/revision tests require native execution by Rork.', 'Five new iOS handoff/revision/RPC-encoding tests require native execution by Rork.')
          s=s.replace('## Validation boundary', 'The live actual-use RPC requires p_water_volume_l with no default, while its database column explicitly permits null. The iOS request previously omitted nil water via encodeIfPresent. It now always sends that argument, preserving Not recorded as null and explicit zero as zero. This fixes a demonstrated legacy-data API contract defect without inventing quantities or relaxing new-spray entry validation. Its exact contribution to the handset pending Trip remains unverified.\n\n## Validation boundary')
          s=s.replace('Remove the temporary patch transport file and branch-specific validation workflow before merging; they are not runtime code.', 'Temporary patch transport and branch-specific workflows were removed after their jobs started; their exact-source validation receipts remain in Actions history.')
          p.write_text(s)
          PY
          swiftc -frontend -parse ios/VineTrack/Backend/Sync/SprayTankActualStore.swift ios/VineTrackTests/SprayInitialTankAmountsTests.swift
          git diff --check
          git diff --exit-code f1a5115eb7ff15538a612817c5992d09110ca22f -- android-vinetrack scripts/recovery-writer-tests.init.gradle
          git rm scripts/incident-spray-recovery.patch.b64 .github/workflows/spray-review-recovery-inspection.yml .github/workflows/ios-actual-water-contract.yml
          git add ios/VineTrack/Backend/Sync/SprayTankActualStore.swift ios/VineTrackTests/SprayInitialTankAmountsTests.swift docs/reviews/spray-review-and-recovery-writer-contracts-20261101.md
          git diff --cached --check
          git config user.name 'VineTrack incident source validation'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'fix(ios): send explicit null for unrecorded actual water; retire incident transport'
          git push origin HEAD:"$GITHUB_REF_NAME"
          git rev-parse HEAD
