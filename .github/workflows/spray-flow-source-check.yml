name: Isolated spray flow source verification
on:
  push:
    branches: [fix/spray-flow-human-testing-20261030]
    paths: [.github/workflows/spray-flow-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Export exact source for focused inspection
        run: git archive --format=tar.gz --output=/tmp/vinetrack-spray-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: vinetrack-spray-source
          path: /tmp/vinetrack-spray-source.tar.gz
          retention-days: 1
