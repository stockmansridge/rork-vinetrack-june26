name: Quadrant source verification
on:
  push:
    branches: [feature/quadrant-count-admin]
    paths:
      - .github/workflows/quadrant-source-check.yml
permissions:
  contents: write
concurrency:
  group: quadrant-source-publish
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/feature/quadrant-count-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quadrant-count-admin
      - name: Verify and apply the reviewed source patch (no app build or deployment)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = [Path('tools/quadrant-count.patch.xz.b64.' + str(i)) for i in (1, 2, 3)]
          data = ''.join(p.read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          expected = '8853e2c8c2d44ea568b6c725346888350bf5d25e6351c4b284db578a6f41b900'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Source patch checksum mismatch'
          Path('/tmp/quadrant-count.patch').write_bytes(patch)
          print('Reviewed patch SHA-256 verified:', expected)
          PY
          git apply --check /tmp/quadrant-count.patch
          git apply /tmp/quadrant-count.patch
          git diff --check
          git rm tools/quadrant-count.patch.xz.b64.1 tools/quadrant-count.patch.xz.b64.2 tools/quadrant-count.patch.xz.b64.3
          git add ios/VineTrack android-vinetrack/app/src/main/java/com/rork/vinetrack scripts/test-quadrant-count.py sql/quadrant_count_admin_beta.sql docs/quadrant-count-admin-beta.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add System Admin-only Quadrant Count on iOS and Android'
          git push origin HEAD:refs/heads/feature/quadrant-count-admin
          echo "Published source commit: $(git rev-parse HEAD)"
