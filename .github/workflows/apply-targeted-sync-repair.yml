name: Apply verified targeted sync follow-up
on:
  push:
    branches: [fix/trip-recovery-yield-parity-20261030]
    paths: ['.github/workflows/apply-targeted-sync-repair.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'stockmansridge/rork-vinetrack-june26' && github.ref == 'refs/heads/fix/trip-recovery-yield-parity-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact locally tested edits, retain Rork base, and remove transport
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          branch = 'fix/trip-recovery-yield-parity-20261030'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          assert os.environ['GITHUB_SHA'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          parts = [(root / f'.repair-tmp/{i}.b64').read_text().strip() for i in range(1,4)]
          # Correct the single identified transport transcription, then require the
          # original packet digest and every exact before/after source digest.
          assert parts[0].count('XYWoXmecWecZC4') == 1
          parts[0] = parts[0].replace('XYWoXmecWecZC4','XYWoXmecWcZC4')
          raw = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '94ba44c9be94685067d6ebdbfc20fc9a9123ffcf5442e108e363ce9fd4459e11'
          pack = json.loads(raw)
          assert pack['base'] == '58dc23dffc7340a56ebebc36868a6eeda40c4081'
          subprocess.run(['git','merge-base','--is-ancestor',pack['base'],'HEAD'], check=True)
          assert len(pack['changes']) == 23
          paths = []
          prepared = []
          for change in pack['changes']:
              path = pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'ios','android-vinetrack','scripts','docs'}
              assert path.suffix in {'.swift','.kt','.py','.md'}
              assert str(path) not in paths
              paths.append(str(path))
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == change['before'], str(path)
              lines = (old or b'').decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == change['after'], str(path)
              prepared.append((path,result))
          for path,result in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
          subprocess.run(['python3','-B','-m','unittest','discover','-s','scripts/tests','-p','test_trip_yield_repair_wiring.py'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          shutil.rmtree('.repair-tmp')
          pathlib.Path('.github/workflows/apply-targeted-sync-repair.yml').unlink()
          subprocess.run(['git','add','--',*paths,'.repair-tmp','.github/workflows/apply-targeted-sync-repair.yml'],check=True)
          subprocess.run(['git','-c','user.name=VineTrack repair automation','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Fix shared bunch-weight full sync and preserve reconciled Trip recovery'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          commit = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          report = {'commit':commit,'base':pack['base'],'verified_files':len(paths),'packet_sha256':hashlib.sha256(raw).hexdigest(),'source_guards':'5 passed','native_builds':'not run; Rork acceptance required','transport_removed':True}
          pathlib.Path(os.environ['RUNNER_TEMP'],'targeted-repair-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: targeted-repair-applied-result
          path: ${{ runner.temp }}/targeted-repair-result.json
          retention-days: 3
          if-no-files-found: error
