name: Android held-Trip recovery validation

on:
  push:
    paths:
      - '.github/workflows/android-trip-recovery-validation.yml'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/HeldTripRecovery.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/CrashLog.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/ActiveTripStore.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/AppViewModel.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/HomeSyncStatus.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/TripsScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/MainActivity.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/HeldTripRecoveryTest.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/TankSessionLifecycle.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/TripEndTankClosureTest.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/LegacySpraySaveStore.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/LegacySprayJournalQuarantine.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/LegacySprayJournalQuarantineTest.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/FreeDriveRowCompletion.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/SprayNoTankWarning.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/FreeDriveRowCompletionTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-trip-recovery-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Supply CI-only generated config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
          if [ ! -f "$CONFIG" ]; then
            cat > "$CONFIG" <<'KOTLIN'
          package com.rork.vinetrack
          object Config {
              val allValues: Map<String, String> = emptyMap()
          }
          KOTLIN
          fi
      - name: Compile Android and run held-Trip / sync-status tests
        working-directory: android-vinetrack
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests "com.rork.vinetrack.data.HeldTripRecoveryTest" \
            --tests "com.rork.vinetrack.data.TripEndTankClosureTest" \
            --tests "com.rork.vinetrack.data.TankSessionLifecycleTest" \
            --tests "com.rork.vinetrack.data.LegacySprayJournalQuarantineTest" \
            --tests "com.rork.vinetrack.data.FreeDriveRowCompletionTest" \
            --tests "com.rork.vinetrack.data.LegacyReplayIsolationTest" \
            --tests "com.rork.vinetrack.data.SyncCrashIsolationTest" \
            --tests "com.rork.vinetrack.data.SelectiveRecoveryReplayTest" \
            --tests "com.rork.vinetrack.data.ActiveTripStoreTest" \
            --tests "com.rork.vinetrack.data.RetainedStartupTest" \
            --tests "com.rork.vinetrack.ui.DeviceTripOwnershipTest" \
            --tests "com.rork.vinetrack.ui.HomeSyncStatusTest"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-trip-recovery-test-results
          path: |
            android-vinetrack/app/build/test-results/testDebugUnitTest/
            android-vinetrack/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
