name: Incident repair validation
on:
  push:
    branches: [fix/spray-start-yield-recovery-20261101]
    paths: [.github/workflows/incident-source-review.yml]
permissions:
  contents: read
jobs:
  reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified follow-up on incident branch only
        id: apply
        run: |
          set -euo pipefail
          if test -f tools/sync-followup.patch.gz.b64; then
            python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          patch=gzip.decompress(base64.b64decode(pathlib.Path('tools/sync-followup.patch.gz.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='26a907386291f3ed4156f35d77f0011c14104bd0e2eaedce81fe57d75483f684'
          pathlib.Path('/tmp/sync-followup.patch').write_bytes(patch)
          PY
            git apply --check /tmp/sync-followup.patch
            git apply /tmp/sync-followup.patch
            git diff --check
            git rm tools/sync-followup.patch.gz.b64
            git add ios scripts/test-trip-occurrence-authority.py
            git config user.name 'VineTrack repair validation'
            git config user.email 'noreply@github.com'
            git commit -m 'fix: retain sync errors and inspect pending Trip stages without replay'
            git push origin HEAD:fix/spray-start-yield-recovery-20261101
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  database:
    needs: reviewed-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-source.outputs.source }}
          persist-credentials: false
      - name: Disposable local PostgreSQL authority regressions (no project access)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          PG_BIN=$(dirname "$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1)") python3 scripts/test-trip-occurrence-authority.py > database-tests.log 2>&1 || { cat database-tests.log; exit 1; }
          cat database-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-database-results
          path: database-tests.log
          retention-days: 3
  android:
    needs: reviewed-source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-source.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: CI-only synthetic managed config (never committed or released)
        run: |
          test ! -e android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
          printf '%s\n' 'package com.rork.vinetrack' 'object Config { val allValues: Map<String, String> = mapOf("EXPO_PUBLIC_SUPABASE_URL" to "https://baseline.invalid", "EXPO_PUBLIC_SUPABASE_ANON_KEY" to "synthetic-not-a-credential", "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" to "synthetic.invalid") }' > android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
      - name: Debug compile with synthetic config, real serializer JVM checks, native test compilation
        working-directory: android-vinetrack
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --init-script ../scripts/combined-recovery-spray-tests.init.gradle :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin > ../native-android.log 2>&1 || { grep -nE '^e:|error:|FAILED|failed' ../native-android.log | head -60; tail -n 50 ../native-android.log; exit 1; }
          tail -n 80 ../native-android.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-android-results
          path: |
            android-vinetrack/app/build/test-results
            native-android.log
          retention-days: 3
  ios:
    needs: reviewed-source
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-source.outputs.source }}
          persist-credentials: false
      - name: Select installed current Xcode
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          versions=list(pathlib.Path('/Applications').glob('Xcode_*.app'))
          chosen=max(versions,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
          subprocess.run(['sudo','xcode-select','-s',str(chosen/'Contents/Developer')],check=True)
          PY
          xcodebuild -version
      - name: Production snapshot codec checks
        run: SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" python3 scripts/test-spray-snapshot-roundtrip.py --swiftc "$(xcrun --sdk macosx -f swiftc)"
      - name: Native app and focused tests
        run: |
          set -euo pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project ios/VineTrack.xcodeproj -scheme VineTrack -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath /tmp/incident-derived CODE_SIGNING_ALLOWED=NO -only-testing:VineTrackTests/SprayInitialTankAmountsTests -only-testing:VineTrackTests/TripOccurrenceJournalTests -only-testing:VineTrackTests/SyncQueueRegressionTests -only-testing:VineTrackTests/TripDeletionRecoveryTests test > native-ios.log 2>&1 || { grep -nE 'error:|failed|FAIL' native-ios.log | head -60; tail -n 60 native-ios.log; exit 1; }
          tail -n 100 native-ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-ios-results
          path: native-ios.log
          retention-days: 3
