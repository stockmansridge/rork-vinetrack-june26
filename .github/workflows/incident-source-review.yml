name: Incident repair validation
on:
  push:
    branches: [fix/spray-start-yield-recovery-20261101]
    paths: [.github/workflows/incident-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=incident-current.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: incident-current
          path: incident-current.tar.gz
          retention-days: 1
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Normal application build, real serializer JVM checks, native test compilation
        working-directory: android-vinetrack
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --init-script ../scripts/combined-recovery-spray-tests.init.gradle :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin > ../native-android.log 2>&1 || { tail -n 120 ../native-android.log; exit 1; }
          tail -n 80 ../native-android.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-android-results
          path: |
            android-vinetrack/app/build/test-results
            native-android.log
          retention-days: 3
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select installed current Xcode
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          versions = list(pathlib.Path('/Applications').glob('Xcode_*.app'))
          chosen = max(versions,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
          subprocess.run(['sudo','xcode-select','-s',str(chosen/'Contents/Developer')],check=True)
          PY
          xcodebuild -version
      - name: Production snapshot codec checks
        run: SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" python3 scripts/test-spray-snapshot-roundtrip.py --swiftc "$(xcrun --sdk macosx -f swiftc)"
      - name: Native app and focused XCTest
        run: |
          set -euo pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project ios/VineTrack.xcodeproj -scheme VineTrack -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath /tmp/incident-derived CODE_SIGNING_ALLOWED=NO -only-testing:VineTrackTests/SprayInitialTankAmountsTests -only-testing:VineTrackTests/TripOccurrenceJournalTests test > native-ios.log 2>&1 || { tail -n 120 native-ios.log; exit 1; }
          tail -n 80 native-ios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-ios-results
          path: native-ios.log
          retention-days: 3
