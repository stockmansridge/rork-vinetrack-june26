name: Incident source review
on:
  push:
    branches: [fix/spray-start-yield-recovery-20261101]
    paths: [.github/workflows/incident-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=incident-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: incident-source
          path: incident-source.tar.gz
          retention-days: 1
