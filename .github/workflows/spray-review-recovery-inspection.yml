name: Spray review and recovery inspection
on:
  push:
    branches: [fix/spray-review-recovery-contracts-20261101]
    paths: [.github/workflows/spray-review-recovery-inspection.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1a5115eb7ff15538a612817c5992d09110ca22f
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Synthetic compile-only configuration, never committed or released
        shell: bash
        run: |
          mkdir -p android-vinetrack/app/src/main/java/com/rork/vinetrack
          cat > android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt <<'EOF'
          package com.rork.vinetrack
          object Config {
              val allValues: Map<String, String> = mapOf(
                  "EXPO_PUBLIC_SUPABASE_URL" to "https://recovery-fixture.invalid",
                  "EXPO_PUBLIC_SUPABASE_ANON_KEY" to "synthetic-no-live-access"
              )
          }
          EOF
      - name: Production-serializer regressions and Android debug compilation
        working-directory: android-vinetrack
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --init-script ../scripts/recovery-writer-tests.init.gradle --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Combined populated-store recovery and refusals
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-vinetrack && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rork.vinetrack.data.auth.ChemicalRecoveryPreflightAndroidTest,com.rork.vinetrack.data.auth.DomainCacheRecoveryAndroidTest --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-recovery-test-results
          path: |
            android-vinetrack/app/build/test-results
            android-vinetrack/app/build/outputs/androidTest-results
            android-vinetrack/app/build/reports
          retention-days: 3
  swift-syntax:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f1a5115eb7ff15538a612817c5992d09110ca22f
          persist-credentials: false
      - name: Parse edited Swift files, not a native app build
        run: swiftc -frontend -parse ios/VineTrack/App/SprayStartRateReview.swift ios/VineTrack/App/SprayCalculatorView.swift ios/VineTrack/Backend/Sync/SprayTankActualStore.swift ios/VineTrack/App/NewMainTabView.swift ios/VineTrack/App/BackendSettingsView.swift ios/VineTrackTests/SprayInitialTankAmountsTests.swift
