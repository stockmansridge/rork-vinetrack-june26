name: Spray review and recovery inspection
on:
  push:
    branches: [fix/spray-review-recovery-contracts-20261101]
    paths: [.github/workflows/spray-review-recovery-inspection.yml]
permissions:
  contents: read
jobs:
  reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed source on incident branch only
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/spray-review-recovery-contracts-20261101"
          git merge-base --is-ancestor a50b35caae65412a949688a2d0a03b5119b718d5 HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          raw=gzip.decompress(base64.b64decode(pathlib.Path('scripts/incident-spray-recovery.patch.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest()=='341e28e2fbbb244f97c37ecef8947220420ea65c1db2e6752d44fd0697135fc5'
          pathlib.Path('/tmp/reviewed.patch').write_bytes(raw)
          PY
          if git apply --reverse --check /tmp/reviewed.patch 2>/dev/null; then
            echo 'Reviewed delta is already present'
          else
            git apply --check /tmp/reviewed.patch
            git apply /tmp/reviewed.patch
            git add android-vinetrack/app/src/main/java/com/rork/vinetrack/data/auth/CleanExitCacheContract.kt android-vinetrack/app/src/main/java/com/rork/vinetrack/data/auth/RetainedJsonFields.kt android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/SprayCalculatorScreen.kt android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/SprayStartActualFields.kt android-vinetrack/app/src/test/java/com/rork/vinetrack/data/auth/RecoveryWriterCompatibilityTest.kt android-vinetrack/app/src/test/java/com/rork/vinetrack/data/auth/SavedChemicalRecoveryContractTest.kt android-vinetrack/app/src/androidTest/java/com/rork/vinetrack/data/auth/ChemicalRecoveryPreflightAndroidTest.kt scripts/recovery-writer-tests.init.gradle ios/VineTrack/App/BackendSettingsView.swift ios/VineTrack/App/NewMainTabView.swift ios/VineTrack/App/SprayCalculatorView.swift ios/VineTrack/App/SprayStartRateReview.swift ios/VineTrack/Backend/Sync/SprayTankActualStore.swift ios/VineTrackTests/SprayInitialTankAmountsTests.swift
            git diff --cached --check
            git config user.name 'VineTrack incident source validation'
            git config user.email 'noreply@users.noreply.github.com'
            git commit -m 'fix: preserve writer-shaped recovery evidence and clarify spray actual-use flow'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  android:
    needs: reviewed-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-source.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Synthetic compile-only configuration, never committed or released
        shell: bash
        run: |
          mkdir -p android-vinetrack/app/src/main/java/com/rork/vinetrack
          cat > android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt <<'EOF'
          package com.rork.vinetrack
          object Config {
              val allValues: Map<String, String> = mapOf(
                  "EXPO_PUBLIC_SUPABASE_URL" to "https://recovery-fixture.invalid",
                  "EXPO_PUBLIC_SUPABASE_ANON_KEY" to "synthetic-no-live-access"
              )
          }
          EOF
      - name: Production-serializer regressions and Android debug compilation
        working-directory: android-vinetrack
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --init-script ../scripts/recovery-writer-tests.init.gradle --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Combined populated-store recovery and refusals
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd android-vinetrack && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rork.vinetrack.data.auth.ChemicalRecoveryPreflightAndroidTest,com.rork.vinetrack.data.auth.DomainCacheRecoveryAndroidTest --console=plain --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-recovery-test-results
          path: |
            android-vinetrack/app/build/test-results
            android-vinetrack/app/build/outputs/androidTest-results
            android-vinetrack/app/build/reports
          retention-days: 3
  swift-syntax:
    needs: reviewed-source
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-source.outputs.source }}
          persist-credentials: false
      - name: Parse edited Swift files, not a native app build
        run: swiftc -frontend -parse ios/VineTrack/App/SprayStartRateReview.swift ios/VineTrack/App/SprayCalculatorView.swift ios/VineTrack/Backend/Sync/SprayTankActualStore.swift ios/VineTrack/App/NewMainTabView.swift ios/VineTrack/App/BackendSettingsView.swift ios/VineTrackTests/SprayInitialTankAmountsTests.swift
