name: Android Bunch Count and Scout UI native build
on:
  push:
    branches: [main]
    paths:
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/YieldEstimationScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/VineyardInsightsScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/ScoutReportScreen.kt'
      - '.github/workflows/android-bunch-scout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-bunch-scout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    name: Compile Android and run existing JVM regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already contains Android command-line tools. The
      # setup-android@v3 action tries to install the removed legacy "tools"
      # package and fails before Gradle even runs on the 2026 runner image.
      - name: Verify runner SDK and install compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER" || { echo "No sdkmanager on runner"; exit 2; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Pin source revision
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Compile Android and test JVM logic
        working-directory: android-vinetrack
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Preserve JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bunch-scout-jvm-results
          path: android-vinetrack/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
