name: Issue 54 Yield Sampling native parity validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue54-yield-native-validation.yml'
      - 'supabase/migrations/*issue54*.sql'
      - 'scripts/issue54_security_*'
      - 'ios/VineTrack/Backend/Repositories/SupabaseYieldEstimationHardDeleteRepository.swift'
      - 'ios/VineTrack/Backend/Sync/OperationsSyncServices.swift'
      - 'ios/VineTrack/LegacyImported/Repositories/YieldRepository.swift'
      - 'ios/VineTrack/LegacyImported/Services/MigratedDataStore+Operations.swift'
      - 'ios/VineTrackTests/YieldCompletionPersistenceTests.swift'
      - 'ios/VineTrackTests/YieldVintageReportTests.swift'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/YieldEstimationSessionRepository.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/YieldSession*Sync.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/DomainCache*.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/AppViewModel.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/YieldCompletionPersistenceTest.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/YieldVintageReportTest.kt'
      - 'ios/VineTrack/Backend/Repositories/SupabaseYieldSamplingSitesRepository.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/YieldPermanentSamplingLocationsView.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/YieldEstimationView.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/YieldEstimationViewModel.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/YieldSamplingNavigationView.swift'
      - 'ios/VineTrack/LegacyImported/Models/YieldEstimationModels.swift'
      - 'ios/VineTrackTests/PanelCountContractTests.swift'
      - 'ios/VineTrackTests/YieldPermanentSiteContractTests.swift'
      - 'ios/VineTrackTests/YieldPanelCountObservationTests.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/PanelCountEntrySheet.swift'
      - 'ios/VineTrack/LegacyImported/Views/Yield/PanelCountSummary.swift'
      - 'ios/VineTrack/LegacyImported/Models/YieldVintageReport.swift'
      - 'ios/VineTrack/LegacyImported/Models/CurrentYieldEstimate.swift'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/YieldSamplingSiteRepository.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/YieldPermanentSamplingSitesScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/YieldEstimationScreen.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/model/YieldEstimationSession.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/PanelCountContractTest.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/YieldPermanentSiteContractTest.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/YieldPanelCountObservationTest.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/PanelCountDialog.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/ui/screens/PanelCountSummary.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/YieldSampleGenerator.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/YieldVintageReport.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/CurrentYieldEstimate.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep only the newest validation of main: intermediate commits must not
  # consume macOS runners or leave a backlog that delays device testing.
  # Scoped to this workflow to avoid cancelling Trip/Sync or other CI gates.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Isolated PostgreSQL deletion roles and replay safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install local PostgreSQL (no production connection)
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql
      - name: Run exact-source security and concurrency tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/issue54-security-sha.txt"
          python3 scripts/issue54_security_validation.py 2>&1 | tee "$RUNNER_TEMP/issue54-security.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue54-isolated-postgres-security
          path: |
            ${{ runner.temp }}/issue54-security-sha.txt
            ${{ runner.temp }}/issue54-security.log
          retention-days: 14

  ios:
    name: iOS simulator compile and yield contract tests
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin Xcode 26.3 and exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          XCODE_ROOT="/Applications/Xcode_26.3.app/Contents/Developer"
          test -x "$XCODE_ROOT/usr/bin/xcodebuild" || { echo "Xcode 26.3 unavailable"; exit 2; }
          echo "DEVELOPER_DIR=$XCODE_ROOT" >> "$GITHUB_ENV"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/issue54-ios-sha.txt"
      - name: Select available iOS simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; a=json.load(sys.stdin)["devices"]; d=[x["udid"] for k,v in a.items() if "iOS" in k for x in v if x.get("isAvailable",False) and "iPhone" in x.get("name","")]; print(d[0] if d else "")')
          test -n "$SIM"
          echo "id=$SIM" >> "$GITHUB_OUTPUT"
      - name: Compile and run Issue 54 plus legacy yield tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/VineTrack.xcodeproj -scheme VineTrack -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/Issue54Yield.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VineTrackTests/PanelCountContractTests \
            -only-testing:VineTrackTests/YieldPermanentSiteContractTests \
            -only-testing:VineTrackTests/YieldPanelCountObservationTests \
            -only-testing:VineTrackTests/QuadrantCountNativeTests \
            -only-testing:VineTrackTests/YieldCompletionPersistenceTests \
            -only-testing:VineTrackTests/YieldVintageReportTests \
            -only-testing:VineTrackTests/TripQueuedUploadScopeTests \
            -only-testing:VineTrackTests/TripEndGateTests \
            -only-testing:VineTrackTests/TripClosureStatusTests \
            -only-testing:VineTrackTests/GuidedSyncRepairEngineTests \
            -only-testing:VineTrackTests/TankSessionTimestampEncodingTests \
            -only-testing:VineTrackTests/TripSyncStageFailureTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/issue54-ios.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue54-ios-yield-native
          path: |
            ${{ runner.temp }}/Issue54Yield.xcresult
            ${{ runner.temp }}/issue54-ios.log
            ${{ runner.temp }}/issue54-ios-sha.txt
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android compile and yield contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36 and immutable source receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          CONFIG=android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
          if [ ! -f "$CONFIG" ]; then
            cat > "$CONFIG" <<'KOTLIN'
          package com.rork.vinetrack
          object Config {
              val allValues: Map<String, String> = emptyMap()
          }
          KOTLIN
          fi
          echo "${{ github.sha }}" > "$RUNNER_TEMP/issue54-android-sha.txt"
      - name: Compile Android and run Issue 54 plus legacy yield tests
        shell: bash
        working-directory: android-vinetrack
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests "com.rork.vinetrack.data.PanelCountContractTest" \
            --tests "com.rork.vinetrack.data.YieldPermanentSiteContractTest" \
            --tests "com.rork.vinetrack.data.YieldPanelCountObservationTest" \
            --tests "com.rork.vinetrack.data.YieldCompletionPersistenceTest" \
            --tests "com.rork.vinetrack.data.YieldVintageReportTest" \
            --tests "com.rork.vinetrack.data.*Trip*Test" \
            --tests "com.rork.vinetrack.data.*Sync*Test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue54-android-yield-native
          path: |
            android-vinetrack/app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/issue54-android-sha.txt
          if-no-files-found: warn
          retention-days: 14
