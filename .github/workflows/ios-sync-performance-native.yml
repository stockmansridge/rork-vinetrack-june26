name: iOS sync performance native validation

# Builds the iOS app and runs the pin sync and legacy spray recovery suites
# touched by the main-thread sync performance work.
# Runs on claude/** branches (before merge) and on main for these files.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ios/VineTrack/Backend/Sync/PinSyncService.swift'
      - 'ios/VineTrack/LegacyImported/Services/LegacySpraySaveRecovery.swift'
      - 'ios/VineTrack/LegacyImported/Services/MigratedDataStore.swift'
      - 'ios/VineTrack/App/NewMainTabView.swift'
      - 'ios/VineTrackTests/TripFlowClosureTests.swift'
      - '.github/workflows/ios-sync-performance-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-sync-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_ROOT="/Applications/Xcode_26.3.app/Contents/Developer"
          test -x "$XCODE_ROOT/usr/bin/xcodebuild" || { echo "::error::Xcode 26.3 unavailable"; exit 2; }
          echo "DEVELOPER_DIR=$XCODE_ROOT" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_ROOT"
          xcodebuild -version
      - name: Select iOS simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; a=json.load(sys.stdin)["devices"]; d=[x["udid"] for k,v in a.items() if "iOS" in k for x in v if x.get("isAvailable",False) and "iPhone" in x.get("name","")]; print(d[0] if d else "")')
          test -n "$SIM"
          echo "id=$SIM" >> "$GITHUB_OUTPUT"
      # testVerifiedReceiptReleasesParentAndTaskLink... expects setWorkTaskLink to
      # reach the repository, which only happens when Supabase is configured;
      # CI builds have no project credentials (same as TripDeletionRecoveryTests).
      - name: Build and test sync performance suites
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/VineTrack.xcodeproj -scheme VineTrack -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/iOSSyncPerformance.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VineTrackTests/RemoteUnchangedSkipTests \
            -only-testing:VineTrackTests/LiveTripBatchedWriteTests \
            -only-testing:VineTrackTests/PinRemoteMergeBatchTests \
            -only-testing:VineTrackTests/DeviceTripOwnershipTests \
            -only-testing:VineTrackTests/TripSyncStageFailureTests \
            -only-testing:VineTrackTests/PinPhotoWorkflowTests \
            -only-testing:VineTrackTests/LinkedPinGrowthDeletionWorkflowTests \
            -only-testing:VineTrackTests/OfflineQuickActionsTests \
            -only-testing:VineTrackTests/LegacyReplayIsolationTests \
            -only-testing:VineTrackTests/LegacySprayPairReceiptTests \
            -only-testing:VineTrackTests/SpraySaveForLaterTests \
            -skip-testing:VineTrackTests/SpraySaveForLaterTests/testVerifiedReceiptReleasesParentAndTaskLinkWithoutRecreatingOriginalPair \
            -only-testing:VineTrackTests/SprayOccurrenceRecoveryHotfixTests \
            -only-testing:VineTrackTests/TripJournalAbsenceIntegrationTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-sync-performance.log"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sync-performance-results
          path: |
            ${{ runner.temp }}/iOSSyncPerformance.xcresult
            ${{ runner.temp }}/ios-sync-performance.log
          if-no-files-found: warn
          retention-days: 14
