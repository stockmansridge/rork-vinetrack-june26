name: iOS Trip flow closure native validation

# Builds the iOS app and runs the Trip start/end closure tests plus the
# existing Trip lifecycle, end-gate, ownership and sync suites they touch.
# Runs on claude/** branches (before merge) and on main for these files.
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'ios/VineTrack/LegacyImported/Services/TripTrackingService.swift'
      - 'ios/VineTrack/LegacyImported/Services/MigratedDataStore.swift'
      - 'ios/VineTrack/LegacyImported/Services/TripEndGate.swift'
      - 'ios/VineTrack/LegacyImported/Services/TankSessionLifecycle.swift'
      - 'ios/VineTrack/LegacyImported/Models/EngineHoursInput.swift'
      - 'ios/VineTrack/LegacyImported/Views/Trips/**'
      - 'ios/VineTrack/App/NewMainTabView.swift'
      - 'ios/VineTrack/App/SprayCalculatorView.swift'
      - 'ios/VineTrack/App/SprayTripStartConfirmationSheet.swift'
      - 'ios/VineTrack/Backend/Sync/TripSyncService.swift'
      - 'ios/VineTrack/Backend/Repositories/SupabaseTripSyncRepository.swift'
      - 'ios/VineTrack/Backend/Repositories/TripSyncRepositoryProtocol.swift'
      - 'ios/VineTrackTests/TripFlowClosureTests.swift'
      - '.github/workflows/ios-trip-flow-closure-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-trip-flow-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_ROOT="/Applications/Xcode_26.3.app/Contents/Developer"
          test -x "$XCODE_ROOT/usr/bin/xcodebuild" || { echo "::error::Xcode 26.3 unavailable"; exit 2; }
          echo "DEVELOPER_DIR=$XCODE_ROOT" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_ROOT"
          xcodebuild -version
      - name: Select iOS simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; a=json.load(sys.stdin)["devices"]; d=[x["udid"] for k,v in a.items() if "iOS" in k for x in v if x.get("isAvailable",False) and "iPhone" in x.get("name","")]; print(d[0] if d else "")')
          test -n "$SIM"
          echo "id=$SIM" >> "$GITHUB_OUTPUT"
      - name: Build and test Trip flow
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/VineTrack.xcodeproj -scheme VineTrack -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/iOSTripFlowClosure.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VineTrackTests/TripFlowClosureTests \
            -only-testing:VineTrackTests/EngineHoursInputTests \
            -only-testing:VineTrackTests/DeviceTripOwnershipTests \
            -only-testing:VineTrackTests/TripEndGateTests \
            -only-testing:VineTrackTests/TankSessionLifecycleTests \
            -only-testing:VineTrackTests/StartTankCommitCoordinatorTests \
            -only-testing:VineTrackTests/TripLocalEndAntiResurrectionTests \
            -only-testing:VineTrackTests/TripSyncStageFailureTests \
            -only-testing:VineTrackTests/TripQueuedUploadScopeTests \
            -only-testing:VineTrackTests/SprayTripPhase5FinalisationTests \
            -only-testing:VineTrackTests/TripDeletionRecoveryTests \
            -only-testing:VineTrackTests/GPSPersistencePerformanceTests \
            -only-testing:VineTrackTripTests/TripStabilisationTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios-trip-flow-closure.log"
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-trip-flow-closure-results
          path: |
            ${{ runner.temp }}/iOSTripFlowClosure.xcresult
            ${{ runner.temp }}/ios-trip-flow-closure.log
          if-no-files-found: warn
          retention-days: 14
