name: Issue 43 Tank Actual RED native tests (branch only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/SprayTankActualTest.kt'
      - 'android-vinetrack/app/src/test/java/com/rork/vinetrack/data/TankDependencyPhaseBTest.kt'
      - 'ios/VineTrackTests/SprayTankActualTests.swift'
      - 'ios/VineTrackTests/TankDependencyVerificationTests.swift'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/model/SprayTankActual.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/TankDependencyVerification.kt'
      - 'android-vinetrack/app/src/main/java/com/rork/vinetrack/data/SprayTankActualRepository.kt'
      - 'ios/VineTrack/LegacyImported/Models/SprayTankActual.swift'
      - 'ios/VineTrack/Backend/Sync/SprayTankActualStore.swift'
      - 'ios/VineTrack/Backend/Sync/TankDependencyVerification.swift'
      - '.github/workflows/issue43-tank-actual-red-native.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: issue43-tank-red-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-red:
    name: Android current production encoder and ACK assertions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show exact source
        run: |
          echo "EXPECTED_BRANCH_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "CHECKOUT_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "${{ github.ref_name }}" = "issue43-tank-actual-p0" || test "${{ github.event_name }}" = "pull_request"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using runner's existing sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "No SDK manager; runner error, not RED"; exit 2; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Supply test-runner-only stub for Rork-generated Config
        shell: bash
        run: |
          set -euo pipefail
          TARGET=android-vinetrack/app/src/main/java/com/rork/vinetrack/Config.kt
          if [ ! -f "$TARGET" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cat > "$TARGET" <<'KOTLIN'
          package com.rork.vinetrack
          // CI-ONLY surrogate for absent Rork-generated Config.kt; NOT a production source edit.
          object Config {
              val allValues: Map<String, String> = emptyMap()
          }
          KOTLIN
            echo "CI_ONLY_GENERATED_CONFIG_STUB=true"
          else
            echo "EXISTING_GENERATED_CONFIG=true"
          fi
      - name: Execute focused native RED assertions
        working-directory: android-vinetrack
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace \
            --tests 'com.rork.vinetrack.data.SprayTankActualTest.issue43*' \
            --tests 'com.rork.vinetrack.data.TankDependencyPhaseBTest.issue43*' \
            2>&1 | tee "$RUNNER_TEMP/issue43-android-gradle.log"
      - name: Upload original JVM test receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue43-android-native-test-receipts
          path: |
            android-vinetrack/app/build/test-results/testDebugUnitTest/
            android-vinetrack/app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/issue43-android-gradle.log
          if-no-files-found: warn
          retention-days: 7

  ios-red:
    name: iOS current production RPC encoder and ACK assertions
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Show exact source and installed Xcode
        run: |
          echo "EXPECTED_BRANCH_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "CHECKOUT_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          xcodebuild -version
      - name: Choose available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); phones=[x for k,v in d["devices"].items() if "iOS" in k for x in v if x.get("isAvailable",False) and "iPhone" in x.get("name","")]; print(phones[0]["udid"] if phones else "")')
          if [ -z "$SIMULATOR_ID" ]; then echo "No eligible iPhone simulator; infrastructure failure, NOT RED"; exit 2; fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "Selected $SIMULATOR_ID"
      - name: Execute focused XCTest RED assertions
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/VineTrack.xcodeproj \
            -scheme VineTrack \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/Issue43TankActual.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VineTrackTests/SprayTankActualTests/testIssue43ProductionRPCRequestRequiresNullLinkageKeys \
            -only-testing:VineTrackTests/SprayTankActualTests/testIssue43ChemicalRoundTripRetainsAndroidProvenance \
            -only-testing:VineTrackTests/TankDependencyVerificationTests/testIssue43ReadbackRejectsChangedLinkageAtSameQuantity \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/issue43-ios-xcodebuild.log"
      - name: Upload XCTest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue43-ios-native-test-receipts
          path: |
            ${{ runner.temp }}/Issue43TankActual.xcresult
            ${{ runner.temp }}/issue43-ios-xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
