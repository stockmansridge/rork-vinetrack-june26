// Validation-only build task: exports immutable tracked baseline into an isolated test workspace.
gradle.projectsEvaluated {
    gradle.rootProject.tasks.register('exportSprayBaseline') {
        doLast {
            def revision = 'd0d846cbb3adaa5acf49f32cdbf480a9953ad21c'
            def platform = gradle.rootProject.findProperty('baselinePlatform') ?: 'android-vinetrack'
            if (!(platform in ['android-vinetrack', 'ios'])) throw new GradleException('Unsupported baseline platform')
            def prefix = platform == 'ios' ? 'spray-ios-baseline-' : 'spray-baseline-'
            def destination = new File(gradle.rootProject.projectDir.parentFile, '.rork-tmp/' + prefix + revision)
            if (destination.exists()) {
                throw new GradleException('Baseline destination already exists; inspect it rather than overwrite.')
            }
            def process = new ProcessBuilder('git', 'archive', '--format=zip', revision, platform)
                .directory(gradle.rootProject.projectDir.parentFile).start()
            def archive = process.inputStream.bytes
            def diagnostics = process.errorStream.text
            if (process.waitFor() != 0) throw new GradleException('Read-only baseline export failed: ' + diagnostics)
            destination.mkdirs()
            def root = destination.canonicalFile.toPath()
            def zip = new java.util.zip.ZipInputStream(new ByteArrayInputStream(archive))
            try {
                java.util.zip.ZipEntry entry
                while ((entry = zip.nextEntry) != null) {
                    def target = root.resolve(entry.name).normalize()
                    if (!target.startsWith(root)) throw new GradleException('Invalid archive member path')
                    if (entry.isDirectory()) {
                        java.nio.file.Files.createDirectories(target)
                    } else {
                        java.nio.file.Files.createDirectories(target.parent)
                        java.nio.file.Files.copy(zip, target)
                    }
                    zip.closeEntry()
                }
            } finally {
                zip.close()
            }
            if (platform == 'android-vinetrack') new File(destination, 'android-vinetrack/gradlew').setExecutable(true)
            println('EXPORTED_BASELINE=' + revision)
            println('ISOLATED_DIRECTORY=' + destination.absolutePath)
        }
    }
    gradle.rootProject.tasks.register('compareSprayBaselineResults') {
        doLast {
            def root = gradle.rootProject.projectDir.parentFile
            def baseline = new File(root, '.rork-tmp/spray-baseline-d0d846cbb3adaa5acf49f32cdbf480a9953ad21c/android-vinetrack/app/build/test-results/testDebugUnitTest')
            def current = new File(root, 'android-vinetrack/app/build/test-results/testDebugUnitTest')
            def readResults = { directory ->
                def cases = [:]
                def files = directory.listFiles()?.findAll { it.name.startsWith('TEST-') && it.name.endsWith('.xml') }
                if (!files) throw new GradleException('No executed XML at ' + directory)
                files.each { file ->
                    def suite = new groovy.xml.XmlSlurper().parse(file)
                    suite.testcase.each { item ->
                        def failure = item.failure
                        def status = item.skipped.size() > 0 ? 'skipped' : item.error.size() > 0 ? 'error' : failure.size() > 0 ? 'failed' : 'passed'
                        def trace = failure.text().readLines().find { it.contains('com.rork.vinetrack.data.') && it.contains('Test.kt:') }?.trim()
                        cases[item.@classname.text() + '#' + item.@name.text()] = [status: status, message: failure.@message.text(), assertionFrame: trace]
                    }
                }
                return cases
            }
            def old = readResults(baseline)
            def now = readResults(current)
            def absent = old.keySet().findAll { !now.containsKey(it) }
            def changed = old.keySet().findAll { now.containsKey(it) && old[it] != now[it] }
            def oldFailures = old.findAll { key, value -> value.status == 'failed' }
            println(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                baselineRevision: 'd0d846cbb3adaa5acf49f32cdbf480a9953ad21c',
                baselineCases: old.size(), currentCases: now.size(),
                baselineFailures: oldFailures, missingCurrentCases: absent,
                changedResults: changed.collectEntries { [(it): [baseline: old[it], current: now[it]]] },
                additionalCurrentCases: now.keySet().findAll { !old.containsKey(it) }
            ])))
            if (!absent.isEmpty() || !changed.isEmpty()) throw new GradleException('Baseline/current results differ; inspect the comparison')
        }
    }
    gradle.rootProject.tasks.register('verifySprayBaseline') {
        doLast {
            def revision = 'd0d846cbb3adaa5acf49f32cdbf480a9953ad21c'
            def platform = gradle.rootProject.findProperty('baselinePlatform') ?: 'android-vinetrack'
            if (!(platform in ['android-vinetrack', 'ios'])) throw new GradleException('Unsupported baseline platform')
            def prefix = platform == 'ios' ? 'spray-ios-baseline-' : 'spray-baseline-'
            def destination = new File(gradle.rootProject.projectDir.parentFile, '.rork-tmp/' + prefix + revision)
            def process = new ProcessBuilder('git', 'ls-tree', '-r', '-z', revision, '--', platform)
                .directory(gradle.rootProject.projectDir.parentFile).start()
            def tree = process.inputStream.text
            def diagnostics = process.errorStream.text
            if (process.waitFor() != 0) throw new GradleException('Read-only baseline inventory failed: ' + diagnostics)
            def count = 0
            tree.split('\u0000').findAll { !it.isEmpty() }.each { entry ->
                def parts = entry.split('\t', 2)
                def expected = parts[0].split(' ')[2]
                def file = new File(destination, parts[1])
                if (!file.isFile()) throw new GradleException('Missing archived baseline file: ' + parts[1])
                def bytes = file.bytes
                def digest = java.security.MessageDigest.getInstance('SHA-1')
                digest.update(('blob ' + bytes.length + '\u0000').getBytes('UTF-8'))
                def actual = digest.digest(bytes).encodeHex().toString()
                if (actual != expected) throw new GradleException('Changed archived baseline file: ' + parts[1])
                count++
            }
            println('VERIFIED_BASELINE=' + revision + ' PLATFORM=' + platform + ' TRACKED_FILES=' + count)
        }
    }
}
