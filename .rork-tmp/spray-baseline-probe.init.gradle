// Additional characterization only; preserves the baseline's original suite XML.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        setSource(gradle.rootProject.fileTree('/home/user/rork-app/.rork-tmp/spray-baseline-probes') { include '**/*.kt' })
    }
    app.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        testLogging { events 'passed', 'failed', 'skipped' }
        reports.junitXml.outputLocation = app.layout.buildDirectory.dir('test-results/cfExposureProbe')
        reports.html.outputLocation = app.layout.buildDirectory.dir('reports/tests/cfExposureProbe')
    }
}
