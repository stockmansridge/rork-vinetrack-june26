                include '**/SprayCalculationContractTest.kt', '**/SprayCalculationReferenceTest.kt'
                include '**/SprayProgramTankFollowupTest.kt', '**/StartTankCommitCoordinatorTest.kt', '**/TripTankAuthorityQueueTest.kt', '**/SprayProgramParityTest.kt'
