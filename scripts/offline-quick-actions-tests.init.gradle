gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        setSource(app.fileTree('src/test/java') {
            include '**/OfflineQuickActionsTest.kt', '**/PinOfflinePayloadTest.kt'
            include '**/PinCreateConflictTest.kt', '**/RetentionReviewTest.kt', '**/SessionLifecycleContractTest.kt'
            include '**/PinDuplicateCheckerTest.kt', '**/PinDuplicateCreateAttemptTest.kt'
            include '**/SprayProgramTankFollowupTest.kt', '**/UnifiedPinContractTest.kt'
        })
    }
    app.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        outputs.upToDateWhen { false }
        filter { excludeTestsMatching 'com.rork.vinetrack.data.RetentionReviewTest' }
        testLogging { events 'passed', 'failed', 'skipped' }
    }
}
