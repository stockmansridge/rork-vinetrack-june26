distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.14.3 (was 8.14.1) — this is a cache-namespace fix, not a feature bump.
#
# The AAB export failed with:
#   ClassNotFoundException: org.jetbrains.kotlin.gradle.plugin.internal.state.TaskLoggers
#   Caused by: java.io.EOFException at ZipFile$ZipFileInputStream.initDataOffset
#
# That class exists, and the published jar is fine (verified: 24 MB, 13,789
# entries, TaskLoggers.class reads cleanly). The EOF happens while reading the
# entry's LOCAL HEADER, which means the zip's central directory was intact but
# pointed past end-of-file. A truncated download cannot look like that — the
# central directory lives at the END of a zip, so a cut-off file fails to open at
# all. A central directory that disagrees with the data is the signature of a jar
# that was REWRITTEN and not finished: Gradle instruments every buildscript /
# plugin-classpath jar into caches/<gradle-version>/transforms, and the loader in
# the stack trace (InstrumentingVisitableURLClassLoader) is the one that reads
# those rewritten copies.
#
# Gradle checksums downloads from a repository, but it never re-validates an
# instrumented jar it has already produced — it trusts the cache key. So a bad
# instrumented jar is not a flaky failure that clears on a retry: it is
# permanent, and every subsequent export fails in exactly the same place. That
# matches the report of a repeat failure while a full cold-cache build passes
# locally.
#
# The instrumented-jar cache is keyed per Gradle version, so moving to the next
# patch release makes the build populate a clean caches/8.14.3 namespace and
# never consult the poisoned 8.14.1 one. Nothing in the app, the Kotlin
# toolchain, or the dependency graph changes — AGP 8.13.2 requires Gradle 8.13+
# and Kotlin 2.3.10 ships the gradle813 plugin variant, so both already support
# this version.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# Checksum of the distribution itself, so a corrupt or partial download of Gradle
# fails immediately and legibly instead of unpacking into a broken toolchain and
# surfacing later as an unrelated class-loading error. Value published by
# services.gradle.org alongside the zip.
distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
