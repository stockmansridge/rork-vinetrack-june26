// Focused JVM regression selection; all production Kotlin still compiles normally.
// Unrelated existing unit fixtures are outside this bounded selection, not certified.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        setSource(app.fileTree('src/test/java') {
            include '**/TrackedSprayCompletionSyncTest.kt', '**/TripClosureStatusPhaseCTest.kt'
            include '**/TankDependencyPhaseBTest.kt', '**/OccurrenceTankConflictHoldTest.kt'
            include '**/AccountScopedTankSafetyTest.kt', '**/RetentionReviewTest.kt'
        })
    }
    app.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        outputs.upToDateWhen { false }
        testLogging { events 'passed', 'failed', 'skipped' }
    }
}
