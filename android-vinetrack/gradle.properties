# Memory tuned for the constrained AAB export machine.
#
# The previous split — 2 GB Gradle JVM + a separate 1.8 GB Kotlin daemon —
# still peaked at ~5.9 GB resident during `bundleRelease` because BOTH JVMs are
# live at once, on top of the forked AAPT2 daemon and D8 worker processes.
# Compiling Kotlin *in-process* removes the second JVM entirely, so one heap is
# sized for the whole build instead of two heaps racing for the same RAM.
# Heap raised 3072m -> 4096m and the serial collector dropped, because
# `compileReleaseKotlin` failed with
#
#   java.lang.OutOfMemoryError: GC overhead limit exceeded
#   > Not enough memory to run compilation.
#
# "GC overhead limit exceeded" is not the same as "heap exhausted": the JVM
# throws it when it spends >98% of its time collecting and recovers <2% of the
# heap. -XX:+UseSerialGC is the direct cause at this size — it does every full
# collection single-threaded and stop-the-world, so once the compiler's live set
# (this module is one large source set, including a ~13k-line view model)
# approaches the ceiling, the collector thrashes instead of finishing a compile
# that a throughput collector completes. Serial GC is the right choice for small
# short-lived JVMs, which is what this was tuned for before Kotlin moved
# in-process; it is the wrong choice for the heap that now hosts the compiler.
#
# Removing the flag restores the default collector, and 4096m gives the compiler
# headroom on a leaner machine. This is still ONE JVM: `in-process` below is what
# keeps the second 1.8 GB Kotlin daemon from existing at all, so peak usage stays
# well under the ~5.9 GB previously measured with two heaps racing.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
# Clean CI builds never reuse incremental state, so building it only costs
# memory and disk.
kotlin.incremental=false
# Single-module project: extra workers buy no wall-clock time but do let AGP run
# several memory-heavy actions (D8 dexing, AAPT2) at once, which is what
# exhausted RAM during the AAB export.
org.gradle.workers.max=1
# No daemon survives an export container, and file-system watching just holds
# extra native memory for a one-shot build.
org.gradle.daemon=false
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
org.gradle.caching=true
org.gradle.configuration-cache=false
# Nothing to parallelise across (one Gradle module), so this only added memory
# pressure on the release/bundle path.
org.gradle.parallel=false

# Harden dependency downloads on fresh/cold-cache machines. Interrupted or
# truncated downloads previously poisoned the module metadata cache
# (module-artifact.bin), making every later build fail on the same entry.
# Generous timeouts + more retries with backoff make cold resolution resilient.
# AGP initializes its analytics/crash-reporting state (AnalyticsSettings) inside
# its project-evaluation listener, resolving the preferences folder from
# ANDROID_USER_HOME (default ~/.android). On the AAB export machine that
# location can be missing/unwritable, which makes AGP's afterEvaluate throw AND
# prevents PluginCrashReporter from class-initializing — producing the masked
# "com/android/build/gradle/internal/crash/PluginCrashReporter" configuration
# failure with the real error swallowed.
#
# FALLBACK ONLY. settings.gradle.kts overrides this with a folder inside the
# checkout, because that is provably writable (Gradle already writes there)
# whereas the writability of a hardcoded absolute /tmp path on a one-shot build
# container is an assumption. This value still applies if that folder cannot be
# created. AndroidLocations checks the system property before the environment
# variable, so either way it applies wherever the build runs.
systemProp.ANDROID_USER_HOME=/tmp/vinetrack-android-user-home

# Always print full stack traces on failure.
#
# AGP routes exceptions thrown during project evaluation through its own crash
# reporter. On a machine that cannot load that reporter class, the REAL
# exception is replaced by a bare
# "com/android/build/gradle/internal/crash/PluginCrashReporter"
# NoClassDefFoundError, and the default (non-stacktrace) output then shows
# nothing about where it came from. The export pipeline controls its own command
# line, so `--stacktrace` cannot be passed by hand; this property is the
# equivalent and applies wherever the build runs. It costs nothing on success
# and makes any future masked failure diagnosable from the first report.
org.gradle.logging.stacktrace=all

systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
