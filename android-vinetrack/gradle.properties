# Memory tuning that must satisfy TWO different constrained machines:
#
#  * The checks machine (assembleRelease — ONE Kotlin compile) has a hard
#    ~6 GB ceiling: -Xmx4096m passes there, while -Xmx5120m failed
#    `compileReleaseKotlin` on IDENTICAL code with a caught OOM ("Couldn't
#    transform method node" / "Not enough memory to run compilation") once the
#    heap tried to grow past what the container could commit. 4096m is the
#    proven upper bound for one JVM — the ceiling cannot go up.
#  * The AAB export machine (bundleRelease + testReleaseUnitTest — TWO Kotlin
#    compiles inside the same JVM, release sources then debug+test sources)
#    failed `compileDebugKotlin` — the SECOND compile — at that same 4096m
#    with "GC overhead limit exceeded": >98% of time collecting, recovering
#    <2% of the heap. That is thrash on a heap crowded with residue, not hard
#    exhaustion — so it is fixable at CONSTANT heap size:
#
#  * -XX:+UseParallelGC — pinned explicitly. On a 1-2 core export container
#    the JVM's ergonomics silently select SerialGC (single-threaded,
#    stop-the-world), exactly the collector that turns a near-full heap into
#    GC-overhead thrash. Merely not passing the old -XX:+UseSerialGC flag only
#    restores a throughput collector on machines with more cores.
#  * -XX:SoftRefLRUPolicyMSPerMB=50 — the in-process Kotlin/IntelliJ compiler
#    front-end caches via SoftReferences, and the default policy (1000 ms of
#    retention per free MB of heap) makes a 4 GB heap keep them essentially
#    forever. The export's second compilation therefore starts on a heap still
#    holding the first compilation's caches — precisely the "GC recovers <2%"
#    pattern. 50 ms lets those caches evaporate under memory pressure instead
#    of thrashing the collector.
#
# Do NOT raise -Xmx to "fix" an OOM here. Tried again during the SQL 221
# season-yield work: 5632m turned the thrash into a hard "Java heap space",
# exactly as the 5120m attempt above did.
#
# The reason raising it cannot work: on the checks runner this line is not even
# read. Gradle resolves GRADLE_USER_HOME/gradle.properties AHEAD of the project
# file, and that runner pins `org.gradle.jvmargs=-Xmx2g` (plus GRADLE_OPTS
# -Xmx2g). Whatever number is written below, the build there gets ~2 GB.
#
# Which is why `in-process` had to go. It compiled Kotlin INSIDE that capped
# JVM, so the compiler shared ~2 GB with Gradle itself and
# `compileReleaseKotlin` died with "GC overhead limit exceeded" → "Couldn't
# transform method node". `out-of-process` requests a separate compiler JVM.
# kotlin.daemon.jvmargs configures daemon-mode compilation; it is not evidence
# of the heap used by an out-of-process compiler. Inspect actual process args.
#
# The project requests a 2560m Gradle heap. These settings do not establish a
# safe peak RSS for every runner. CI overrides, compiler strategy, native tools
# and metaspace must all be accounted for; the historic ~6 GB export budget
# has not been independently measured in this workspace.
#
# `out-of-process` rather than `daemon`: no daemon survives an export container
# (org.gradle.daemon=false below), so a reusable Kotlin daemon buys nothing and
# a short-lived per-invocation JVM is one less process to leak.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50 -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=out-of-process
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50
# Clean CI builds never reuse incremental state, so building it only costs
# memory and disk.
kotlin.incremental=false
# Raised 1 -> 2 after the export was stopped for exceeding its TIME cap.
#
# Two workers balance dexing throughput against concurrent memory pressure.
# The project requests out-of-process Kotlin compilation above, but CI/user-home
# properties can override that choice. Do not assume a single 4 GB JVM or derive
# total resident memory from heap limits: metaspace, native memory and tool
# processes also contribute. Use :app:androidBuildDiagnostics and process
# arguments to inspect the active runner before changing concurrency or heaps.
org.gradle.workers.max=2
# No daemon survives an export container, and file-system watching just holds
# extra native memory for a one-shot build.
org.gradle.daemon=false
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
org.gradle.caching=true
org.gradle.configuration-cache=false
# Nothing to parallelise across (one Gradle module), so this only added memory
# pressure on the release/bundle path.
org.gradle.parallel=false

# Harden dependency downloads on fresh/cold-cache machines. Interrupted or
# truncated downloads previously poisoned the module metadata cache
# (module-artifact.bin), making every later build fail on the same entry.
# Generous timeouts + more retries with backoff make cold resolution resilient.
# AGP initializes its analytics/crash-reporting state (AnalyticsSettings) inside
# its project-evaluation listener, resolving the preferences folder from
# ANDROID_USER_HOME (default ~/.android). On the AAB export machine that
# location can be missing/unwritable, which makes AGP's afterEvaluate throw AND
# prevents PluginCrashReporter from class-initializing — producing the masked
# "com/android/build/gradle/internal/crash/PluginCrashReporter" configuration
# failure with the real error swallowed.
#
# FALLBACK ONLY. settings.gradle.kts overrides this with a folder inside the
# checkout, because that is provably writable (Gradle already writes there)
# whereas the writability of a hardcoded absolute /tmp path on a one-shot build
# container is an assumption. This value still applies if that folder cannot be
# created. AndroidLocations checks the system property before the environment
# variable, so either way it applies wherever the build runs.
systemProp.ANDROID_USER_HOME=/tmp/vinetrack-android-user-home

# Always print full stack traces on failure.
#
# AGP routes exceptions thrown during project evaluation through its own crash
# reporter. On a machine that cannot load that reporter class, the REAL
# exception is replaced by a bare
# "com/android/build/gradle/internal/crash/PluginCrashReporter"
# NoClassDefFoundError, and the default (non-stacktrace) output then shows
# nothing about where it came from. The export pipeline controls its own command
# line, so `--stacktrace` cannot be passed by hand; this property is the
# equivalent and applies wherever the build runs. It costs nothing on success
# and makes any future masked failure diagnosable from the first report.
org.gradle.logging.stacktrace=all

systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
