        updated_at: { type: string, format: date-time }

    BlockRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }

    WorkTaskSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        vineyard_id: { type: string, format: uuid }
        task_type: { type: [string, "null"], description: "The task's label (no canonical title column exists)." }
        status: { type: [string, "null"] }
        date: { type: string, format: date-time }
        start_date: { type: [string, "null"], format: date-time }
        end_date: { type: [string, "null"], format: date-time }
        duration_hours: { type: [number, "null"] }
        area_ha: { type: [number, "null"] }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/BlockRef" }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        is_archived: { type: boolean }
        is_finalized: { type: boolean }
        origin: { type: string, enum: [vinetrack, integration], description: "Creator origin (Stage 8 provenance)." }
        external_id: { type: [string, "null"], description: "Integration-supplied reconciliation id (creator-owned)." }
        costing_method:
          type: string
          enum: [hourly, piece_rate]
          description: >-
            How this task's labour cost is calculated (sql/188). The ONLY switch;
            treat any unrecognised value as hourly. Always present.
        piece_vine_count:
          type: [integer, "null"]
          description: >-
            Historical SNAPSHOT of the vine quantity a piece-rate job was costed
            on. Never recomputed from current vineyard geometry. Operational
            quantity, so always present.
        piece_rate_per_vine:
          type: [number, "null"]
          description: "Agreed price per vine. Present only with costs:read."
        piece_rate_total_cost:
          type: [number, "null"]
          description: >-
            piece_vine_count x piece_rate_per_vine, generated by the database
            from the snapshot. Null unless costing_method is piece_rate. Present
            only with costs:read.
        effective_labour_cost:
          type: [number, "null"]
          description: >-
            THE labour cost of this task (sql/189). piece_rate ->
            piece_rate_total_cost; anything else -> the sum of active, RATED
            labour_lines[].total_cost. The two are NEVER summed. Null means "not
            specified", never 0. A piece-rate task with zero labour lines
            reports its cost here. Present only with costs:read.
        labour_cost_source:
          type: [string, "null"]
          enum: [piece_rate, labour_lines, null]
          description: "Which branch produced effective_labour_cost. Present only with costs:read."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkTaskDetail:
      allOf:
        - $ref: "#/components/schemas/WorkTaskSummary"
        - type: object
          properties:
            labour_lines:
              type: array
              items:
                type: object
                properties:
                  work_date: { type: string, format: date }
                  worker_type: { type: [string, "null"], description: "Worker category, never an identity." }
                  worker_count: { type: integer }
                  hours_per_worker: { type: number }
                  total_hours: { type: number }
                  notes: { type: [string, "null"] }
                  hourly_rate: { type: [number, "null"], description: "Present only with costs:read." }
                  total_cost: { type: [number, "null"], description: "Present only with costs:read." }
            total_labour_hours: { type: number, description: "Derived sum of line total hours." }
            machine_lines:
              type: array
              items:
                type: object
                properties:
                  work_date: { type: string, format: date }
                  equipment_id: { type: [string, "null"], format: uuid }
                  equipment_name: { type: [string, "null"] }
                  duration_hours: { type: [number, "null"] }
                  started_at: { type: [string, "null"], format: date-time }
                  ended_at: { type: [string, "null"], format: date-time }
                  engine_hours_start: { type: [number, "null"] }
                  engine_hours_end: { type: [number, "null"] }
                  engine_hours_used: { type: [number, "null"] }
                  fuel_volume_l: { type: [number, "null"] }
                  entry_source: { type: string, enum: [manual, missed_trip, trip_failed, correction] }
                  notes: { type: [string, "null"] }
                  fuel_cost: { type: [number, "null"], description: "Present only with costs:read." }
                  hourly_rate: { type: [number, "null"], description: "Present only with costs:read." }
                  total_cost: { type: [number, "null"], description: "Present only with costs:read." }
                  operator: { $ref: "#/components/schemas/Operator" }
            trip_ids:
              type: array
              items: { type: string, format: uuid }

    PruningActivity:
      type: object
      properties:
        id: { type: string, format: uuid }
        vineyard_id: { type: string, format: uuid }
        date: { type: string, format: date }
        pruning_method: { type: [string, "null"] }
        season_year: { type: [integer, "null"] }
        vintage_year: { type: [integer, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        labour_hours: { type: [number, "null"] }
        vines_pruned: { type: integer }
        row_equivalents: { type: number, description: "Completed quarters ÷ 4." }
        quarters_completed: { type: integer }
        vines_per_labour_hour: { type: [number, "null"], description: "Derived: vines_pruned ÷ labour_hours." }
        block_summary: { type: [string, "null"] }
        blocks:
          type: array
          items:
            type: object
            properties:
              block_id: { type: string, format: uuid }
              block_name: { type: [string, "null"] }
              row_equivalents: { type: number }
              vines_pruned: { type: integer }
        work_task_id: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
        crew: { type: [string, "null"], description: "Present only with labour:read." }
        hourly_rate: { type: [number, "null"], description: "Recorded hourly rate. On a piece-rate job hours and rate are operational history, never the cost basis. Present only with costs:read." }
        labour_cost:
          type: [number, "null"]
          description: >-
            Effective labour cost (sql/189). A linked piece-rate work task
            reports its snapshot total even with zero labour lines; a linked
            hourly task reports its rated labour lines; an unlinked activity
            keeps labour_hours x hourly_rate. Precedence, never addition. Null
            means "not specified", never 0. Present only with costs:read.
        labour_cost_source:
          type: [string, "null"]
          enum: [piece_rate, labour_lines, activity_hours, null]
          description: "Which branch produced labour_cost. Present only with costs:read."
        costing_method:
          type: [string, "null"]
          enum: [hourly, piece_rate, null]
          description: "Costing method of the linked work task; null when unlinked. Present only with costs:read."
        piece_rate_per_vine: { type: [number, "null"], description: "Linked piece-rate agreement. Present only with costs:read." }
        piece_vine_count: { type: [integer, "null"], description: "Linked piece-rate snapshot quantity. Present only with costs:read." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

