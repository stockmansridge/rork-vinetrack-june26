        origin: { type: string, enum: [vinetrack, integration], description: "Creator origin (Stage 8 provenance)." }
        external_id: { type: [string, "null"], description: "Integration-supplied reconciliation id (creator-owned)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PinSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        vineyard_id: { type: string, format: uuid }
        type: { type: [string, "null"], enum: [repairs, growth, manual_issue, null] }
        custom_type:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
        category: { type: [string, "null"] }
        priority: { type: [string, "null"] }
        status: { type: string, enum: [open, in_progress, completed, cancelled] }
        title: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        growth_stage_code: { type: [string, "null"] }
        block_id: { type: [string, "null"], format: uuid }
        block_name: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        row:
          type: object
          description: Exact snapped path/row identity — never reduced to raw GPS.
          properties:
            snapped_to_row: { type: boolean }
            path_number: { type: [number, "null"], description: "Driving path, e.g. 19.5." }
            row_number: { type: [number, "null"] }
            side: { type: [string, "null"], enum: [left, right, null] }
            along_row_distance_m: { type: [number, "null"] }
            snapped_latitude: { type: [number, "null"] }
            snapped_longitude: { type: [number, "null"] }
        location:
          type: object
          description: Server-authoritative placement resolution.
          properties:
            scope: { type: [string, "null"] }
            is_assigned:
              type: [boolean, "null"]
              description: >-
                Canonical server answer for whether the pin has a usable
                location. Use this for assigned/unassigned filters and counts —
                never re-derive it from block/row fields. A point pin with
                coordinates and no block is assigned; a block pin with no row
                is assigned.
            assignment_basis:
              type: [string, "null"]
              enum: [point_coordinates, snapped_point, row_segments, block, legacy_block, unassigned, null]
            row_summary: { type: [string, "null"] }
            warning:
              type: [string, "null"]
              enum: [location_metadata_incomplete, unassigned_location, null]
              description: >-
                Show a strong "Unassigned location" state ONLY for
                unassigned_location. location_metadata_incomplete means a safe
                assignment was found despite incomplete structured metadata —
                informational only, and still assigned.
        due_date: { type: [string, "null"], format: date }
        work_task_id: { type: [string, "null"], format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        assigned_to: { $ref: "#/components/schemas/Operator" }
        completed_by: { $ref: "#/components/schemas/Operator" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PinDetail:
      allOf:
        - $ref: "#/components/schemas/PinSummary"
        - type: object
          properties:
            row_segments:
              type: array
              description: Exact row/section selection of a row-scope pin (sections are quarters 1-4).
              items:
                type: object
                properties:
                  row: { type: integer }
                  segment: { type: integer, minimum: 1, maximum: 4 }
